sonar.projectKey=mapp_cloud_wordpress
sonar.projectName=Mapp Cloud Wordpress

# Source directories (PHP source only, no tests)
sonar.sources=bin,src,mapp_intelligence.php,uninstall.php

# Exclude test directories and generated/minified assets
sonar.exclusions=Test/**,**/*.min.js,**/node_modules/**

# No coverage reports
sonar.php.coverage.reportPaths=
sonar.coverage.exclusions=**/*

# Encoding
sonar.sourceEncoding=UTF-8
